version: '3.9'

services:

  backend:
    build: ./backend
    container_name: backend
    restart: always
    ports:
      - "8080:8080"   # nếu bạn muốn public luôn BE
    environment:
      SPRING_PROFILES_ACTIVE: prod
    networks:
      - app-network

  frontend:
    build: ./frontend
    container_name: frontend
    restart: always
    networks:
      - app-network

  nginx:
    image: nginx:1.27
    container_name: nginx
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend
      - frontend
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - frontend_dist:/usr/share/nginx/html
    networks:
      - app-network

volumes:
  frontend_dist:

networks:
  app-network:
