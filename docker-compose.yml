version: '3.9'

services:

  backend:
    build: ./backend
    container_name: backend
    restart: always
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: prod
    networks:
      - app-network

  frontend:
    build: ./frontend
    container_name: frontend
    restart: "no"  # Chỉ build rồi tắt
    volumes:
      - frontend_dist:/app/dist  # THÊM: Share dist sang volume
    networks:
      - app-network
    command: sh -c "echo 'Frontend build completed' && exit 0"

  nginx:
    image: nginx:1.27
    container_name: nginx
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend
      - frontend
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - frontend_dist:/usr/share/nginx/html:ro  # Đọc từ volume
    networks:
      - app-network

volumes:
  frontend_dist:

networks:
  app-network: